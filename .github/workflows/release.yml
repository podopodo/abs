name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Verify tag
        run: git describe --tags --exact-match
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet and test
        run: |
          go vet ./...
          go test -race ./...
      - name: Build release archives
        run: |
          go run ./cmd/releasepack \
            --version "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --out dist
      - name: Smoke-test Linux AMD64 archive
        run: |
          mkdir smoke
          tar -xzf dist/acp_linux_amd64.tar.gz -C smoke acp
          ./smoke/acp version
          ./smoke/acp check
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
      - name: Preserve workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "ACP ${GITHUB_REF_NAME}" \
            --generate-notes
